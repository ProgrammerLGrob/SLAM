## @file param.yaml
#  @package visual_odom.config
#  @brief Central configuration file for the runtime parameters of the visual_odom_node.
#
#  This YAML file defines all thresholds for depth filtering, RANSAC optimization,
#  particle count of the localization filter, and the path to the rosbag that
#  should be played back.

visual_odom_node:
  ros__parameters:

    # ==========================================================================
    # Parameters for depth and image preprocessing
    # ==========================================================================

    ## @brief Maximum reliable sensor depth of the Kinect camera in millimeters (mm).
    max_depth: 7000

    ## @brief Allowed temporal deviation when synchronizing RGB and depth images (in seconds).
    rgb_depth_sync_tolerance_sec: 0.1

    ## @brief Pixel tolerance range in image space for spatial deduplication of neighboring keypoints.
    pixel_tolerance: 5

    ## @brief Match threshold below which new landmarks are added to the map.
    matches_for_new_landmarks: 500

    ## @brief Minimum trust value a landmark must maintain before being removed from the map.
    min_landmark_trust: 15.0


    # ==========================================================================
    # RANSAC and Kabsch alignment parameters
    # ==========================================================================

    ransac:
      ## @brief Allowed Euclidean distance deviation in meters (m) for classifying a point as an inlier.
      evaluation_tolerance: 0.05

      ## @brief Maximum number of iterations for hypothesis evaluation in the RANSAC algorithm.
      iterations: 30

      ## @brief Minimum sample size (point pairs) per iteration for computing a transformation hypothesis.
      sample_size: 3

      ## @brief Minimum number of feature matches required before starting RANSAC optimization.
      min_matches_for_ransac: 10

      ## @brief Maximum physically plausible robot rotation per frame in degrees (deg).
      max_rotation_angle_deg: 15.0

      ## @brief Minimum required ratio of inliers to total matches for accepting a RANSAC result.
      min_inlier_ratio: 0.2


    # ==========================================================================
    # Particle Filter (Localization)
    # ==========================================================================

    ## @brief Number of active robot particle samples within the Rao-Blackwellized particle filter.
    n_robot_samples: 2


    # ==========================================================================
    # Rosbag configuration (input data stream)
    # ==========================================================================

    ## @brief Absolute path to the MCAP rosbag file to be recorded or played back.
    #  The path for the "Around The Desks" scenario is currently active.
